name: "📝 Docs"
description: "블로그 글과 사용 설명서를 쓰거나 고치기"
title: "[DOCS] "
labels: ["chore"]
type: SubTask
body:
  - type: markdown
    attributes:
      value: |
        제목 앞 `[DOCS]`를 **지우지 마세요.** 이 접두사로 브랜치(`chore/#번호`)와 라벨(`chore`)이 자동 생성됩니다.
        이슈 유형은 feat, fix, refactor, chore 네 가지뿐이라 글 작업은 chore로 묶이고, 커밋 타입은 `docs(blog):`처럼 씁니다.

        생성 후 상단 **Parent issue**에서 `ssccops`의 Story나 Task를 연결하세요 (cross-repo 가능).
        Epic에 닿지 않는 이슈는 어디에도 잡히지 않습니다.

        글 작성 규칙은 이 레포 `AGENTS.md`의 «글 작성 규칙» 절에 있습니다.

  - type: dropdown
    id: target
    attributes:
      label: 📦 대상
      options:
        - "새 블로그 글"
        - "이미 게시된 블로그 글 고치기"
        - "사용 설명서 (메타 레포에서 한 절씩 옮겨 오는 중)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 📄 무엇을 쓰나
      description: |
        누가 읽고 무엇을 알게 되는지 먼저 적습니다. 고치는 글이면 무엇이 틀렸는지.
      placeholder: |
        운영진이 바뀔 때마다 행사 신청을 받고 심사하는 흐름을 처음부터 다시 설명하고 있다.
        한 행사를 처음부터 끝까지 따라가는 글이 있으면 인수인계 자료가 된다.
    validations:
      required: true

  - type: input
    id: file
    attributes:
      label: 🗂 파일 이름
      description: 영문 소문자와 하이픈으로 씁니다. 이 이름이 글 주소가 되고, 게시한 뒤에는 바꾸지 않습니다.
      placeholder: blog/event-application-walkthrough.md
    validations:
      required: false

  - type: textarea
    id: work
    attributes:
      label: ✅ 작업할 내용
      description: 체크박스로 씁니다.
      value: |
        - [ ] 초안을 쓴다 (`description`, `authors` 포함)
        - [ ] PR의 Cloudflare 미리보기에서 실제 화면을 본다
    validations:
      required: true

  - type: checkboxes
    id: boundary
    attributes:
      label: 🔒 공개 경계
      description: 이 레포와 사이트는 공개입니다. 메타 레포에서는 써도 되는 것이 글에서는 안 됩니다.
      options:
        - label: 내부 IP, 열린 포트, 서버 구성, 대시보드 주소를 쓰지 않는다
        - label: 메타 레포(`ssccops`) 이슈나 문서 링크를 걸지 않는다. 필요한 내용은 요지를 풀어 쓴다
        - label: 회원 정보(실명, 학번, 연락처)와 비밀값을 쓰지 않는다. 스크린샷에도 없다

  - type: textarea
    id: refs
    attributes:
      label: 🙋🏻 참고 자료
      description: 상위 이슈, 글의 바탕이 되는 ADR이나 문서.
      placeholder: |
        - 상위: SoongSilComputingClub/ssccops#525
    validations:
      required: false
